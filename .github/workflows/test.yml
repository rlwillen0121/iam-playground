name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n ./lab
        run: bash -n ./lab
      - name: lab stub shell test
        run: bash tests/lab_stub_test.sh
      - name: unit tests
        run: python3 -m pip install -r requirements.txt && python3 -m pytest -q

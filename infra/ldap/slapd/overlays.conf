# cn=config LDIF. osixia/openldap:1.5.0 already loads memberof as overlay {0}
# and refint as overlay {1}. This file adjusts those overlays and adds ppolicy.
# {{ LDAP_BACKEND }} and {{ LDAP_BASE_DN }} are substituted at first start.
#
# memberOf
# The memberof overlay maintains the operational memberOf attribute from the
# member attribute of entries whose objectClass is iamGroup. Clients write
# member. They do not write memberOf. olcMemberOfDangling ignore: a member
# value that does not yet name an entry is left in place. olcMemberOfRefInt
# TRUE: memberOf is maintained together with the refint overlay on rename
# and delete. The image default (groupOfUniqueNames / uniqueMember) is
# replaced because that class requires at least one uniqueMember.
#
# Referential integrity
# refint, running as the database rootdn, rewrites DN-valued member,
# memberOf, manager, owner, and uniqueMember when the named entry is renamed,
# and removes those values when the named entry is deleted. iamGroup does
# not require member, so deleting the last member leaves a schema-valid
# empty group. refint_nothing is not set; a placeholder DN is not used.
# groupOfNames and groupOfUniqueNames are not the empty-group strategy:
# each requires a member, and removing the last one is an object-class
# violation.
#
# ppolicy
# Needed so pwdAccountLockedTime: 000001010000Z is an administrative lock.
# See infra/ldap/disable.md. pwdLockout must be TRUE on the default policy
# or the lock is not enforced. A locked account fails a new bind. A
# connection that already bound is not closed.

dn: olcOverlay={0}memberof,olcDatabase={1}{{ LDAP_BACKEND }},cn=config
changetype: modify
replace: olcMemberOfDangling
olcMemberOfDangling: ignore
-
replace: olcMemberOfRefInt
olcMemberOfRefInt: TRUE
-
replace: olcMemberOfGroupOC
olcMemberOfGroupOC: iamGroup
-
replace: olcMemberOfMemberAD
olcMemberOfMemberAD: member
-
replace: olcMemberOfMemberOfAD
olcMemberOfMemberOfAD: memberOf

dn: olcOverlay={1}refint,olcDatabase={1}{{ LDAP_BACKEND }},cn=config
changetype: modify
replace: olcRefintAttribute
olcRefintAttribute: member
olcRefintAttribute: memberOf
olcRefintAttribute: manager
olcRefintAttribute: owner
olcRefintAttribute: uniqueMember

dn: cn=module{0},cn=config
changetype: modify
add: olcModuleLoad
olcModuleLoad: ppolicy

dn: olcOverlay=ppolicy,olcDatabase={1}{{ LDAP_BACKEND }},cn=config
changetype: add
objectClass: olcOverlayConfig
objectClass: olcPPolicyConfig
olcOverlay: ppolicy
olcPPolicyDefault: cn=default,ou=System,{{ LDAP_BASE_DN }}
olcPPolicyHashCleartext: FALSE
olcPPolicyUseLockout: TRUE

# cn=config LDIF for osixia/openldap. The image does not read slapd.conf.
# Applied after the image ACL. {{ LDAP_BASE_DN }} and {{ LDAP_BACKEND }}
# are substituted at first start. Mount with --copy-service.
#
# cn=aggregator,ou=ServiceAccounts may read and may not write.
# cn=provisioner,ou=ServiceAccounts may write under ou=People and ou=Groups.
# userPassword is not readable by the aggregator. write implies read, so the
# provisioner can read password values under People and Groups.
# pwdAccountLockedTime is readable by the aggregator and writable by the
# provisioner on People entries. That is the account-disable attribute.

dn: olcDatabase={1}{{ LDAP_BACKEND }},cn=config
changetype: modify
delete: olcAccess
-
add: olcAccess
olcAccess: {0}to * by dn.exact=gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth manage by * break
olcAccess: {1}to dn.subtree="ou=People,{{ LDAP_BASE_DN }}" attrs=userPassword,shadowLastChange by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" manage by dn.exact="cn=provisioner,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" write by anonymous auth by self write by * none
olcAccess: {2}to attrs=userPassword,shadowLastChange by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" manage by anonymous auth by self auth by * none
olcAccess: {3}to dn.exact="ou=People,{{ LDAP_BASE_DN }}" attrs=children by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" manage by dn.exact="cn=provisioner,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" write by dn.exact="cn=aggregator,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" read by * break
olcAccess: {4}to dn.exact="ou=Groups,{{ LDAP_BASE_DN }}" attrs=children by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" manage by dn.exact="cn=provisioner,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" write by dn.exact="cn=aggregator,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" read by * break
olcAccess: {5}to dn.subtree="ou=People,{{ LDAP_BASE_DN }}" attrs=pwdAccountLockedTime by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" manage by dn.exact="cn=provisioner,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" write by dn.exact="cn=aggregator,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" read by self read by * none
olcAccess: {6}to dn.subtree="ou=People,{{ LDAP_BASE_DN }}" by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" manage by dn.exact="cn=provisioner,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" write by dn.exact="cn=aggregator,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" read by self read by * none
olcAccess: {7}to dn.subtree="ou=Groups,{{ LDAP_BASE_DN }}" by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" manage by dn.exact="cn=provisioner,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" write by dn.exact="cn=aggregator,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" read by self read by * none
olcAccess: {8}to * by dn.exact="cn=admin,{{ LDAP_BASE_DN }}" write by dn.exact="cn=provisioner,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" read by dn.exact="cn=aggregator,ou=ServiceAccounts,{{ LDAP_BASE_DN }}" read by self read by * none
